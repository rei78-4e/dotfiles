[osd]
enabled = false

    [osd.kinds]
    keyboard_layout = false

[plugins]
enabled = [ "dotnetrob/cat" ]

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

    [[plugins.source]]
    kind = "path"
    location = "~/.local/share/noctalia/plugins/PN/"
    name = "pl"

[shell]
avatar_path = "/home/rei/Pictures/self/night.jpg"
clipboard_auto_paste = "off"
clipboard_history_max_entries = 1000
font_family = "Monaspace Radon Var"

    [shell.launcher]
    compact = true

    [shell.panel]
    control_center_placement = "floating"
    open_near_click_control_center = true

[theme]
builtin = "Rosé Pine"
community_palette = "Rose Pine Moon Alt"
mode = "light"
shell_mode = "dark"
source = "community"
wallpaper_scheme = "m3-content"

[wallpaper]
directory = "/home/rei/Pictures/wallpapers"

    [wallpaper.automation]
    enabled = false
    interval_seconds = 900

    [wallpaper.default]
    path = "/home/rei/Pictures/wallpapers/tabako.png"

    [wallpaper.last]
    path = "/home/rei/Pictures/wallpapers/tabako.png"

    [wallpaper.monitors.DP-1]
    path = "/home/rei/Pictures/wallpapers/tabako.png"

    [wallpaper.monitors.DP-3]
    path = "/home/rei/Pictures/wallpapers/ghost_game.jpeg"

    [wallpaper.monitors.eDP-1]
    path = "/home/rei/Pictures/wallpapers/tabako.png"

[widget.cat]
poll_interval = 1
type = "dotnetrob/cat:cat"
walk_threshold = 3

[widget.clock]
format = "{:%b %d %a %H:%M}"

[widget.media]
hide_when_no_media = true
max_length = 340

[widget.network]
show_label = false

[widget.ram]
show_value = false

[widget.spacer_2]
type = "spacer"

[widget.taskbar]
group_by_workspace = true
only_active_workspace = true
show_workspace_label = false

[widget.temp]
label_show_units = false
show_glyph = true
show_value = false
visualization = "gauge"

[widget.tray]
hidden = [ "bluetooth" ]

[widget.volume.actions]
scroll_down = "volume-up 2"
scroll_up = "volume-down 2"
