[backdrop]
blur_intensity = 0.0
enabled = true
tint_intensity = 0.0

[bar]
order = [ "default", "bar" ]

    [bar.bar]
    center = [ "workspaces" ]
    enabled = false
    end = [
        "media",
        "tray",
        "notifications",
        "network",
        "bluetooth",
        "volume",
        "brightness",
        "battery",
        "wallpaper",
        "clock",
        "control-center"
    ]
    margin_ends = 0
    position = "right"
    radius = 0
    start = [ "launcher" ]

    [bar.default]
    background_opacity = 0.40
    center = [ "media", "spacer_2", "clock" ]
    end = [ "cat", "ram", "temp", "tray", "bluetooth", "network", "volume", "control-center", "wallpaper", "notifications" ]
    font_family = "Moralerspace Radon HW"
    margin_ends = 0
    radius = 0
    start = [ "workspaces", "taskbar" ]

[calendar]
enabled = true

    [calendar.account.personal_google]
    color = "primary"
    name = "rei"
    type = "google"

[control_center.calendar]
show_events_card = true
show_week_numbers = true

