font_size 11
modify_font cell_height 100%
modify_font cell_width 100%
enable_audio_bell no
cursor_shape beam

# tab bar
tab_bar_edge top
tab_bar_margin_width 0.0
tab_bar_margin_height 4.0 4.0
tab_bar_style separator
# tab_bar_align left
tab_separator " | "
tab_activity_symbol '!'

# theme
# include themes/rose-pine-moon.conf
include themes/rose-pine-dawn.conf
env TERM_BACKGROUND=light

# background_opacity 0.6

scrollbar hovered

# BEGIN_KITTY_FONTS
font_family      family='Monaspace Radon Var' variable_name=MonaspaceRadonVar style=MonaspaceRadonVar-Regular
bold_font        family='Monaspace Radon Var' variable_name=MonaspaceRadonVar style=MonaspaceRadonVar-Bold
italic_font      family='Monaspace Radon Var' variable_name=MonaspaceRadonVar style=MonaspaceRadonVar-Italic
bold_italic_font auto
# END_KITTY_FONTS

symbol_map U+3000-U+303F,U+3040-U+309F,U+30A0-U+30FF,U+31F0-U+31FF,U+4E00-U+9FFF,U+FF00-U+FFEF Noto Sans Mono CJK JP

map ctrl+shift+t launch --cwd=current --type=tab
map ctrl+shift+n new_os_window_with_cwd
map ctrl+shift+, load_config_file

map ctrl+shift+w close_window
map ctrl+shift+j launch --location=hsplit --cwd current
map ctrl+shift+l launch --location=vsplit --cwd current
map ctrl+shift+k combine : launch --location=hsplit --cwd current : move_window up
map ctrl+shift+h combine : launch --location=vsplit --cwd current : move_window left

map ctrl+h neighboring_window left
map ctrl+l neighboring_window right
map ctrl+k neighboring_window up
map ctrl+j neighboring_window down

map ctrl+[ resize_window narrower 10
map ctrl+] resize_window wider 10
map ctrl+up resize_window taller 10
map ctrl+down resize_window shorter 10

mouse_map ctrl+left click ungrabbed mouse_handle_click link
notify_on_cmd_finish unfocused 5.0
allow_remote_control yes
enabled_layouts splits
shell_integration enabled
listen_on unix:/tmp/mykitty

# read-clipboard/read-primary を足すのは OSC52 での読み取り (SSH 先の nvim で
# "+p を押したときのペースト) を許可するため。読み取りが無いと nvim が応答を
# 待ち続けてタイムアウトする
clipboard_control write-clipboard write-primary read-clipboard read-primary
