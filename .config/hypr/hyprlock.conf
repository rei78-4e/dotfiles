general {
    hide_cursor = true
}

# Uncoated paper: an opaque sheet, no screenshot, no blur, no dim.
background {
    monitor =
    color = rgb(f1eee5)
    blur_passes = 0
    blur_size = 0
    noise = 0
    contrast = 1
    brightness = 1
    vibrancy = 0
    vibrancy_darkness = 0
}

# Main paper-light panel. Hierarchy comes from a 1px rule, not from shadow.
shape {
    monitor =
    size = 560, 430
    color = rgb(fbf9f2)
    rounding = 0
    border_size = 1
    border_color = rgb(b7b0a2)
    position = 0, 55
    halign = center
    valign = center
    zindex = 0
}

input-field {
    monitor =
    size = 350, 52
    outline_thickness = 1
    dots_size = 0.2
    dots_spacing = 0.15
    dots_center = true
    dots_rounding = 0
    outer_color = rgb(b7b0a2)
    inner_color = rgb(fbf9f2)
    font_color = rgb(2d302b)
    fade_on_empty = false
    fade_timeout = 1000
    # $FPRINTPROMPT swaps between auth:fingerprint:ready_message and
    # present_message on its own; $FPRINTFAIL is empty unless a scan failed.
    # Both live here rather than in standalone labels, because a label bound to
    # an empty variable still renders a 1px sliver.
    placeholder_text = <i>Input Password...</i>  $FPRINTPROMPT $FPRINTFAIL
    font_family = Monaspace Radon Var
    hide_input = false
    rounding = 0
    check_color = rgb(d38ca0)
    fail_color = rgb(a84435)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = rgb(a84435)
    numlock_color = -1
    bothlock_color = -1
    invert_numlock = false
    swap_font_color = false
    position = 0, -105
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = $TIME
    color = rgb(2d302b)
    font_size = 120
    font_family = Monaspace Radon Var
    position = 0, 170
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = cmd[update:43200000] echo "$(date +"%A, %d %B %Y")"
    color = rgb(d38ca0)
    font_size = 24
    font_family = Monaspace Radon Var
    position = 0, 70
    halign = center
    valign = center
    zindex = 1
}

# Short rule between the date line and the login block.
shape {
    monitor =
    size = 200, 1
    color = rgb(d0c9bb)
    rounding = 0
    position = 0, 24
    halign = center
    valign = center
    zindex = 0
}

# Fingerprint status line. $FPRINTPROMPT renders auth:fingerprint:ready_message
# while idle and present_message while scanning; $FPRINTFAIL is empty unless a
# scan failed, so the second label stays invisible until it has something to say.
label {
    monitor =
    text = Welcome back, $USER
    color = rgb(77766d)
    font_size = 18
    font_family = Monaspace Radon Var
    position = 0, -35
    halign = center
    valign = center
    zindex = 1
}

auth {
    # hyprlock talks to fprintd over DBus itself, so this does NOT need
    # pam_fprintd / security.pam.services.hyprlock.fprintAuth.
    fingerprint:enabled = true
    fingerprint:ready_message = <span foreground="##d38ca0">(scan fingerprint)</span>
    fingerprint:present_message = <span foreground="##77766d">authenticating...</span>
    fingerprint:retry_delay = 250

    pam:enabled = true
    pam:module = hyprlock
}

