general {
    hide_cursor = true
}

# Rosé Pine Moon glass: blur and dim the current desktop behind the cards.
background {
    monitor =
    path = screenshot
    color = rgb(232136)
    blur_passes = 4
    blur_size = 8
    noise = 0.0117
    contrast = 0.9
    brightness = 0.4
    vibrancy = 0.0
    vibrancy_darkness = 0.0
}

# Main glass panel behind the clock, greeting and password field.
shape {
    monitor =
    size = 560, 440
    color = rgba(232136d9)
    rounding = 16
    border_size = 1
    border_color = rgba(c4a7e755)
    position = 0, 45
    halign = center
    valign = center
    zindex = 0
}

input-field {
    monitor =
    size = 350, 52
    outline_thickness = 1
    dots_size = 0.2
    dots_spacing = 0.15
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(c4a7e777)
    inner_color = rgba(181725cc)
    font_color = rgb(e0def4)
    fade_on_empty = false
    fade_timeout = 1000
    # $FPRINTPROMPT swaps between auth:fingerprint:ready_message and
    # present_message on its own; $FPRINTFAIL is empty unless a scan failed.
    # Both live here rather than in standalone labels, because a label bound to
    # an empty variable still renders a 1px sliver.
    placeholder_text = <i>Input Password...</i>  $FPRINTPROMPT $FPRINTFAIL
    font_family = Monaspace Radon Var
    hide_input = false
    rounding = 10
    check_color = rgb(c4a7e7)
    fail_color = rgb(eb6f92)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = rgb(eb6f92)
    numlock_color = -1
    bothlock_color = -1
    invert_numlock = false
    swap_font_color = false
    position = 0, -120
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = $TIME
    color = rgb(e0def4)
    font_size = 120
    font_family = Monaspace Radon Var
    position = 0, 160
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = cmd[update:43200000] echo "$(date +"%A, %d %B %Y")"
    color = rgb(c4a7e7)
    font_size = 24
    font_family = Monaspace Radon Var
    position = 0, 50
    halign = center
    valign = center
    zindex = 1
}

# Fingerprint status line. $FPRINTPROMPT renders auth:fingerprint:ready_message
# while idle and present_message while scanning; $FPRINTFAIL is empty unless a
# scan failed, so the second label stays invisible until it has something to say.
label {
    monitor =
    text = Welcome back, $USER
    color = rgb(908caa)
    font_size = 18
    font_family = Monaspace Radon Var
    position = 0, -70
    halign = center
    valign = center
    zindex = 1
}

auth {
    # hyprlock talks to fprintd over DBus itself, so this does NOT need
    # pam_fprintd / security.pam.services.hyprlock.fprintAuth.
    fingerprint:enabled = true
    fingerprint:ready_message = <span foreground="##c4a7e7">(scan fingerprint)</span>
    fingerprint:present_message = <span foreground="##908caa">authenticating...</span>
    fingerprint:retry_delay = 250

    pam:enabled = true
    pam:module = hyprlock
}

