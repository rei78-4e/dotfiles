# OSクリップボードと同期（可能なら）
# set-option -g set-clipboard on
# set -g set-clipboard on
set -g mode-keys vi

# sync clipboard
# set-option -g set-clipboard external

# ローカルでは wl-copy、SSH 越しでは OSC52 でクライアント端末へ送る
# (詳しくは ~/.config/tmux/clipboard.sh のコメント参照)
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel '$HOME/.config/tmux/clipboard.sh'
bind-key -T copy-mode-vi Enter send -X copy-pipe-and-cancel '$HOME/.config/tmux/clipboard.sh'

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# アクティブペインを強調する
# tmux はペイン境界を共有の1本線で描くため、強調されるのはアクティブ側に接する線分のみ
set -g pane-active-border-style "fg=#86cfc7"
set -g pane-border-style "fg=#4a5553"
set -g pane-border-lines heavy
set -g pane-border-indicators colour

# copy-mode を vim の操作感に寄せる
# (mode-keys は vi 済み。既定では v が矩形選択なので visual 選択に変える)
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'V' send -X select-line
bind-key -T copy-mode-vi 'C-v' send -X rectangle-toggle

# change pain size
bind-key -n M-Up resize-pane -U 3
bind-key -n M-Down resize-pane -D 3
bind-key -n M-Left resize-pane -L 3
bind-key -n M-Right resize-pane -R 3

# if local.conf exist, load
if-shell "test -f ~/.config/tmux/local.conf" "source-file ~/.config/tmux/local.conf"

# OSC52を使ってクリップボードに送る（必要な場合）
# set-option -g terminal-overrides 'xterm*:clipboard:cc'

set -g default-terminal "tmux-256color"
# source-file を繰り返しても terminal-features の追記が重複しないよう既定値へ戻す
set -gu terminal-features
set -as terminal-features ',*:RGB'
set -as terminal-features ',*:clipboard'
set -as terminal-features ',xterm*:extkeys'
set -g extended-keys always
set -s extended-keys-format csi-u
# Codex が Shift+Enter を改行として認識できる CSI-u sequence を明示的に送る
bind-key -n S-Enter send-keys -H 1b 5b 31 33 3b 32 75
set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[2 q'

# クライアント端末 (kitty / ghostty) への機能転送
# - clipboard: set-clipboard on と合わせ、SSH 先のコピーを OSC52 で端末へ届ける
# - kitty graphics: tmux 自身の terminal feature ではなく、画像を出すアプリが
#   tmux passthrough で転送する (kitten icat / chafa / yazi など)
set -g allow-passthrough on

# General settings
set -g mouse on
unbind -T copy-mode-vi MouseDragEnd1Pane
set-option -g set-clipboard on
# set-option -ga terminal-overrides ',xterm-256color:clipboard:enable'

set -g @scroll-speed-num-lines-per-scroll 0.5

# Status bar: tmux 既定の構成のまま、色だけ控えめなミントにする
# (themegreen は端末パレットの原色緑なので強すぎる)
set -g status-style "fg=#22302f,bg=#86cfc7"
set -g status-justify left
set -g status-position bottom
set -g status-interval 5
set -g status-left-length 20
set -g status-right-length 60

set -g status-left "[#{session_name}] "

set -g window-status-format "#I:#W#{?window_flags,#{window_flags}, }"
set -g window-status-current-format "#I:#W#{?window_flags,#{window_flags}, }"
set -g window-status-separator " "
set -g window-status-style "default"
set -g window-status-current-style "underscore"
set -gu window-status-activity-style

# 右: バッテリー RAM 時刻 日付
# sysfs / procfs 直読み。バッテリー残量 20% 未満は反転表示で知らせる。
# - バッテリーの index は機種依存 (ThinkPad は BAT0、この Debian 機は BAT1) なので
#   glob で最初に見つかった capacity を読む。
# - #{<:...} は文字列比較で、"100" < "20" が真になる。数値比較は #{e|<:...} を使う。
# - 値が空のまま比較に入ると 0 として扱われ、条件が常に真になって status-right
#   全体が反転する (背景が黒くなる)。空なら 100 とみなす。
set -g @bat_capacity "cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -n1"
set -g status-right "#{?#{e|<:#(#{@bat_capacity} | grep . || echo 100),20},#[reverse],}BAT #(#{@bat_capacity})% RAM #(awk '/MemTotal/{t=$2}/MemAvailable/{a=$2}END{printf\"%.0f\",100-100*a/t}' /proc/meminfo)% %H:%M %d-%b-%y "
